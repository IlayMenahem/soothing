[package]
name = "polynomial_milp"
version = "0.1.0"
edition = "2024"
description = "A MILP based solver for polynomial systems of equations."
license = "MIT"

[lib]
name = "polynomial_milp"
path = "lib.rs"

[[bin]]
name = "groebner"
path = "bin/groebner.rs"

[[bin]]
name = "factor"
path = "bin/factor.rs"

[[bin]]
name = "milp_cover"
path = "bin/milp_cover.rs"

[[bin]]
name = "bench"
path = "bin/bench.rs"

[[bin]]
name = "sig_groebner"
path = "bin/sig_groebner.rs"

[dependencies]
rayon = "1.10"
regex = "1"
symbolica = "1.5"
thiserror = "1"
good_lp = { version = "1", default-features = false, features = ["highs"] }
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
