[package]
name = "polynomial_cdcl"
version = "0.1.0"
edition = "2024"
description = "A CDCL based solver for polynomial systems of equations."
license = "MIT"

[lib]
name = "polynomial_cdcl"
path = "lib.rs"

[[bin]]
name = "sig_groebner"
path = "bin/sig_groebner.rs"

[[bin]]
name = "idos"
path = "bin/idos.rs"

[dependencies]
rayon = "1.10"
regex = "1"
symbolica = "1.5"
thiserror = "1"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
