[package]
name = "soothing-linear"
version = "0.1.0"
edition = "2021"
description = "Linear elimination by substitution for polynomial systems (paper specification)."
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"

[dependencies]
anyhow = "1"
arithmetic-parser = "0.4.0-beta.1"
regex = "1"
nom = "7"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
num-bigint = "0.4"
rand = "0.8"
rayon = "1"
thiserror = "1.0"
egg = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
