[package]
name = "polynomial_cdcl"
version = "0.1.0"
edition = "2024"
description = "A CDCL based solver for polynomial systems of equations."
license = "MIT"

[lib]
name = "polynomial_cdcl"
path = "lib.rs"

[[bin]]
name = "sig_groebner"
path = "bin/sig_groebner.rs"

[[bin]]
name = "branching"
path = "bin/branching.rs"

[[bin]]
name = "variable_zeroing"
path = "bin/variable_zeroing.rs"

[dependencies]
rayon = "1.12"
rand = "0.10"
regex = "1"
symbolica = "3.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
