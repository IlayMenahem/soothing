[package]
name = "symbolica-elim"
version = "0.1.0"
edition = "2024"
description = "DFS linear elimination using Symbolica: sampled predicates, exact Q predicates, and Mathematica loaders (standalone; no soothing-linear dependency)."
license = "MIT"

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "solve_exact"
path = "src/bin/solve_exact.rs"

[[bin]]
name = "bench_solve"
path = "src/bin/bench_solve.rs"

[[bin]]
name = "groebner"
path = "src/bin/groebner.rs"

[profile.release]
opt-level = 3
lto = "fat"

[dependencies]
ahash = "0.8"
rayon = "1.10"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.8"
regex = "1"
symbolica = "1.5"
thiserror = "1"
